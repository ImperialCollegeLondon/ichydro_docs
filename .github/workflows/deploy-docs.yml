name: Deploy MkDocs (Multi-language)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Set up uv
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          prune-cache: false
          activate-environment: true
          python-version: 3.x

      - name: Install dependencies
        run: uv sync

      # Build each language into its own subdirectory
      - name: Build docs
        run: |
          mkdocs build -f config/en/mkdocs.yml
          mkdocs build -f config/es/mkdocs.yml

      # Copy the root redirect index.html into the site folder
      - name: Copy root index redirect
        run: cp root_index.html site/index.html

      # Deploy the entire site/ folder to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
